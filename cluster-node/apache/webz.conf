<VirtualHost 172.20.0.100:80>

    ServerName  172.20.0.100
    DocumentRoot /var/www/html

    # Custom homepage
    DirectoryIndex index.html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Log to files so Pacemaker's apache agent can health-check cleanly
    ErrorLog  ${APACHE_LOG_DIR}/webz-error.log
    CustomLog ${APACHE_LOG_DIR}/webz-access.log combined

</VirtualHost>